<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="通过手机动作、点击或空格键演奏的节奏小游戏。">
  <title>节奏</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <section class="instrument" aria-label="节奏鼓面">
      <button id="pad" class="pad" aria-label="敲击鼓面，点击或按空格键发声">
        <span id="pad-text">敲击</span>
      </button>
      <output id="feedback" class="feedback" aria-live="polite"></output>
    </section>

    <div class="controls">
      <button id="start">开始</button>
      <label class="tempo"><input id="bpm" type="number" inputmode="numeric" min="40" max="180" value="60" aria-label="每分钟节拍数">BPM</label>
      <output id="score" aria-label="命中节拍数">0 / 32</output>
    </div>
    <div class="options">
      <button id="motion" aria-pressed="false" title="启用手机动作触发"><span>动作</span></button>
      <button id="settings-open">设置</button>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <div class="dialog-header"><h2>设置</h2><button aria-label="关闭设置">关闭</button></div>
      <label class="setting" for="window">判定窗口<output id="window-value">±150 ms</output></label>
      <input id="window" type="range" min="50" max="150" step="10" value="150">
      <label class="setting" for="sensitivity">动作灵敏度<output id="sensitivity-value">6</output></label>
      <input id="sensitivity" type="range" min="1" max="10" step="1" value="6">
      <label class="setting" for="volume">音量<output id="volume-value">70%</output></label>
      <input id="volume" type="range" min="0" max="100" value="70">
      <label class="setting check-setting" for="metronome">参考节拍<input id="metronome" type="checkbox"></label>
    </form>
  </dialog>
</body>
</html>
